name: Assets del perfil

on:
  schedule:
    - cron: "30 3 * * *"   # todos los días 03:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/*.json"
      - "scripts/build_assets.py"
      - ".github/workflows/assets.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Banner, radares y tarjetas (proyectos, stats, lenguajes). Sin dependencias externas.
      - name: Generar SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_assets.py --user "${{ github.repository_owner }}"

      - name: Commit si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: actualizar assets del perfil"
          git push
